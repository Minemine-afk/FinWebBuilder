<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>__TITLE__</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style><style id="page-style">
__BASE_CSS__
.line-on td{opacity:1}tr.off td{opacity:.45}
td.l, th.l{text-align:left;white-space:normal;min-width:11rem}
td.q input{width:5.5rem;display:inline-block}
.choices{display:flex;flex-wrap:wrap;gap:.3rem}.choices button{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:.15rem .6rem;font-size:.75rem;cursor:pointer}.choices button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.spark{vertical-align:middle}
.range-big{font-size:2rem;font-weight:650;color:var(--accent);margin:.3rem 0 .1rem;line-height:1.15}
@media (max-width:640px){.range-big{font-size:1.6rem}}
</style></head><body><header class="band">
  <div class="wrap"><div>
    <p class="eyebrow" style="color:var(--on-accent-muted)">Cost estimate</p>
    <h1 id="title"></h1>
    <p id="scope"></p>
  </div></div>
</header><main>
  <div class="wrap"><div class="grid">
    <aside id="sidebar" aria-label="Settings"></aside>
    <section class="results" aria-live="polite"><div id="summary"></div><div id="lines" class="results"></div><p class="limits" id="limits"></p></section>
  </div></div>
</main><script>window.SPEC=__SPEC_JSON__;</script><script>
"use strict";
__COMMON_JS__
__ENGINE_JS__
const spec = window.SPEC;
const TODAY = new Date();
const CUR = spec.currency;
const tierOptions = spec.tiers ? spec.tiers.options : [{ id: "default", label: "" }];
const P = spec.providers;
const state = {
  tier: spec.tiers ? spec.tiers.default : "default",
  preset: spec.presets ? spec.presets.default : null,
  provider: P ? P.default : null,
  yearText: String(spec.priceYear), year: spec.priceYear,
  inputText: Object.fromEntries(spec.inputs.map((i) => [i.id, String(i.default)])), inputs: {},
  qtyText: {}, qty: {}, on: {},
  contText: String(Math.round(spec.contingency.default * 1000) / 10), contingency: spec.contingency.default,
  errors: {}
};
const CONT_LIMITS = { min: 0, max: Math.round(spec.contingency.max * 100), fallback: spec.contingency.default * 100, label: "Contingency", unit: "%" };
const curProvider = () => (P ? P.options.find((o) => o.id === state.provider) || P.options[0] : null);

function readInputs() {
  state.errors = {};
  for (const i of spec.inputs) {
    const r = clampInput(state.inputText[i.id], { min: i.min, max: i.max, fallback: i.default, label: i.label, unit: i.unit });
    state.inputs[i.id] = r.value; if (r.error) state.errors["in-" + i.id] = r.error;
  }
  const c = clampInput(state.contText, CONT_LIMITS);
  state.contingency = c.value / 100; if (c.error) state.errors.cont = c.error;
  if (P) {
    const y = clampInput(state.yearText, { min: spec.priceYear, max: P.maxYear, fallback: spec.priceYear, label: "Year", unit: "" });
    state.year = Math.round(y.value); if (y.error) state.errors.year = y.error;
  }
  for (const l of spec.lines) {
    if (l.per !== "fixed" || state.qtyText[l.id] === undefined) continue;
    const r = clampInput(state.qtyText[l.id], { min: 0, max: l.qtyMax, fallback: l.qty, label: "Quantity", unit: "" });
    state.qty[l.id] = r.value; if (r.error) state.errors["qty-" + l.id] = r.error;
  }
}
const errP = (key) => `<p class="err" data-err="${esc(key)}" style="margin:0" hidden></p>`;
function syncErrors() { document.querySelectorAll("[data-err]").forEach((el) => { const m = state.errors[el.dataset.err]; el.hidden = !m; el.textContent = m || ""; }); }
const range = (lo, hi) => (Math.round(lo) === Math.round(hi) ? money(lo, CUR) : money(lo, CUR) + " – " + money(hi, CUR));
const signedPct = (r) => (r > 0 ? "+" : "") + pct(r);

function renderSidebar() {
  let h = "";
  if (spec.presets) {
    h += `<label class="field" for="presetSel"><span>${esc(spec.presets.label)}</span><select id="presetSel">${spec.presets.options.map((o) => `<option value="${esc(o.id)}"${o.id === state.preset ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select><span class="muted small" id="presetNote"></span></label>`;
  }
  if (P) {
    h += `<fieldset><legend>${esc(P.label)}</legend><label class="field" for="provSel"><span class="small">Who does the work</span><select id="provSel">${P.options.map((o) => `<option value="${esc(o.id)}"${o.id === state.provider ? " selected" : ""}>${esc(o.name)}${o.type ? " · " + esc(o.type) : ""}</option>`).join("")}</select></label>
      <div id="provInfo" class="small"></div>
      <label class="field" for="year"><span class="small">Year of the work ${tip(`Prices are ${spec.priceYear} figures. For a later year, each provider's prices grow at the yearly rate of its own last three or more years of prices (shown below), compounded. Past rises don't guarantee future ones.`)}</span><input id="year" type="number" inputmode="numeric" min="${spec.priceYear}" max="${P.maxYear}" step="1" value="${esc(state.yearText)}" class="num"><span class="muted small">${spec.priceYear} to ${P.maxYear}.</span></label>${errP("year")}</fieldset>`;
  }
  if (spec.tiers) {
    h += `<fieldset><legend>${esc(spec.tiers.label)}</legend><div class="seg" role="group" aria-label="${esc(spec.tiers.label)}">${tierOptions.map((o) => `<button type="button" data-tier="${esc(o.id)}" aria-pressed="${o.id === state.tier}">${esc(o.label)}</button>`).join("")}</div><p class="muted small" id="tierNote" style="margin:0"></p></fieldset>`;
  }
  if (spec.inputs.length) {
    h += `<fieldset><legend>Size and quantity</legend>${spec.inputs.map((i) => `<label class="field" for="in-${esc(i.id)}"><span class="small">${esc(i.label)}${i.unit ? " (" + esc(i.unit) + ")" : ""}${tip(i.rationale)}</span>
      ${i.choices ? `<span class="choices">${i.choices.map((c) => `<button type="button" data-choice="${esc(i.id)}" data-value="${c.value}" aria-pressed="${String(Number(state.inputText[i.id]) === c.value)}">${esc(c.label)}</button>`).join("")}</span>` : ""}
      <input id="in-${esc(i.id)}" data-input="${esc(i.id)}" type="number" inputmode="decimal" min="${i.min}" max="${i.max}" step="${i.step}" value="${esc(state.inputText[i.id])}" class="num">
      <span class="muted small">Range ${i.min.toLocaleString("en-SG")} to ${i.max.toLocaleString("en-SG")}.${i.note ? " " + esc(i.note) : ""}</span></label>${errP("in-" + i.id)}`).join("")}</fieldset>`;
  }
  h += `<fieldset><legend>Contingency</legend><label class="field" for="cont"><span class="small">Buffer on top of the total (%)</span>
    <input id="cont" type="number" inputmode="decimal" min="0" max="${CONT_LIMITS.max}" step="1" value="${esc(state.contText)}" class="num">
    <span class="muted small">Costs usually overrun; ${Math.round(spec.contingency.default * 100)}% is the default. Range 0 to ${CONT_LIMITS.max}%.</span></label>${errP("cont")}</fieldset>`;
  $("sidebar").innerHTML = h;
}

function renderLines() {
  const staleMs = 365 * 864e5;
  let h = "";
  for (const g of spec.groups) {
    const mine = spec.lines.filter((l) => l.group === g.id);
    if (!mine.length) continue;
    h += `<div class="panel"><div class="panel-head"><h3>${esc(g.label)}</h3><span class="num" id="grp-${esc(g.id)}"></span></div><div class="tablewrap"><table><thead><tr><th class="l">Item</th><th class="l">Quantity</th><th>Low</th><th>High</th><th class="l">Source</th></tr></thead><tbody>`;
    for (const l of mine) {
      const src = l.source || {};
      const stale = src.verified && TODAY.getTime() - new Date(src.verified).getTime() > staleMs;
      h += `<tr data-line="${esc(l.id)}"><td class="l"><label class="check" style="align-items:flex-start"><input type="checkbox" data-on="${esc(l.id)}"> <span><b>${esc(l.label)}</b>${tip(l.rationale)}${l.optional ? ` <span class="pill">Optional</span>` : ""}${l.description ? `<br><span class="muted small">${esc(l.description)}</span>` : ""}${l.notes ? `<br><span class="muted small">${esc(l.notes)}</span>` : ""}</span></label></td>
        <td class="l q">${l.per === "fixed" ? `<input type="number" inputmode="decimal" min="0" max="${l.qtyMax}" step="any" value="${l.qty}" data-qty="${esc(l.id)}" aria-label="Quantity of ${esc(l.label)}" class="num">` : `<span id="q-${esc(l.id)}" class="num"></span>`} <br><span class="muted small" id="u-${esc(l.id)}"></span>${errP("qty-" + l.id)}</td>
        <td id="lo-${esc(l.id)}"></td><td id="hi-${esc(l.id)}"></td>
        <td class="l">${sourceBadge(src)}${src.verified ? `<br><span class="muted small">checked ${esc(src.verified)}${stale ? " · may be outdated" : ""}</span>` : ""}</td></tr>`;
    }
    h += `</tbody></table></div></div>`;
  }
  $("lines").innerHTML = h;
}

/** A provider's own price history plus where its rate takes it, as a small inline chart. */
function spark(p, upto) {
  const rate = historyRate(p.history);
  const past = p.history.slice().sort((a, b) => a.year - b.year);
  const last = past[past.length - 1];
  const fut = [];
  for (let y = last.year + 1; y <= Math.max(upto, last.year); y++) fut.push({ year: y, value: last.value * Math.pow(1 + rate, y - last.year) });
  const all = past.concat(fut), W = 120, H = 30;
  const y0 = all[0].year, y1 = all[all.length - 1].year || y0 + 1;
  const lo = Math.min(...all.map((a) => a.value)), hi = Math.max(...all.map((a) => a.value));
  const x = (y) => 2 + (W - 4) * ((y - y0) / Math.max(1, y1 - y0)), yy = (v) => H - 3 - (H - 6) * (hi === lo ? 0.5 : (v - lo) / (hi - lo));
  const pts = (arr) => arr.map((a) => x(a.year).toFixed(1) + "," + yy(a.value).toFixed(1)).join(" ");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="var(--series-1)" stroke-width="2" points="${pts(past)}"/>${fut.length ? `<polyline fill="none" stroke="var(--series-1)" stroke-width="1.5" stroke-dasharray="3 3" points="${pts([last].concat(fut))}"/>` : ""}</svg>`;
}

function providerPanel(est) {
  const p = est.provider.provider;
  if (!p) return "";
  const past = p.history.slice().sort((a, b) => a.year - b.year);
  const rows = past.map((h, i) => `<tr><td>${h.year}</td><td class="l" style="white-space:normal">${esc(h.label || "")}${h.url && safeUrl(h.url) ? ` <a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(hostOf(h.url))}</a>` : ""}</td><td>${money(h.value, CUR)}</td><td>${i ? signedPct(h.value / past[i - 1].value - 1) : "–"}</td></tr>`).join("");
  const last = past[past.length - 1];
  const proj = [];
  for (let y = last.year + 1; y <= state.year; y++) proj.push(`<tr class="muted"><td>${y}</td><td class="l">Projected at ${pct(est.provider.rate)} a year</td><td>${money(last.value * Math.pow(1 + est.provider.rate, y - last.year), CUR)}</td><td>${signedPct(est.provider.rate)}</td></tr>`);
  return `<div class="panel"><div class="panel-head"><h3>${esc(p.name)}: price history and trend ${tip(p.rationale)}</h3>${sourceBadge(p.source)}</div>
    <p class="small" style="margin:0">Price level: <b>${p.factor === 1 ? "market average" : pct(Math.abs(p.factor - 1)) + (p.factor > 1 ? " above" : " below") + " the market ranges"}</b> ${tip(p.factorBasis)} · Yearly change from its own prices: <b>${signedPct(est.provider.rate)}</b> ${tip(`Compound yearly growth from ${past[0].year} (${money(past[0].value, CUR)}) to ${last.year} (${money(last.value, CUR)}): (${money(last.value, CUR)} ÷ ${money(past[0].value, CUR)}) ^ (1 ÷ ${last.year - past[0].year}) − 1. Used to price a job in a later year.`)}${p.notes ? `<br><span class="muted">${esc(p.notes)}</span>` : ""}</p>
    <div class="tablewrap"><table><thead><tr><th>Year</th><th class="l">Price on record</th><th>Price</th><th>Change</th></tr></thead><tbody>${rows}${proj.join("")}</tbody></table></div></div>`;
}

function providerTable() {
  const rows = compareProviders(spec, state);
  if (!rows.length) return "";
  const max = Math.max(1, ...rows.map((r) => r.high));
  let h = `<div class="panel"><div class="panel-head"><h3>Same job at every ${esc(P.label.toLowerCase())}, ${state.year}</h3><span class="muted small">Your settings, cheapest first. Pick a row to use it.</span></div><div class="tablewrap"><table><thead><tr><th>${esc(P.label)}</th><th>Price level</th><th>Yearly change</th><th>Trend</th><th>Estimated total</th></tr></thead><tbody>`;
  for (const r of rows) {
    const p = P.options.find((o) => o.id === r.id);
    h += `<tr data-pick="${esc(r.id)}" tabindex="0"${r.id === state.provider ? ' class="sel" aria-current="true"' : ""}><td style="white-space:normal">${esc(r.name)}${r.type ? `<br><span class="sub">${esc(r.type)}</span>` : ""}</td><td>${r.factor === 1 ? "Market" : (r.factor > 1 ? "+" : "−") + Math.round(Math.abs(r.factor - 1) * 100) + "%"}</td><td>${signedPct(r.rate)}</td><td>${spark(p, state.year)}</td><td>${range(r.low, r.high)}<div aria-hidden="true" style="height:6px;margin-top:4px;border-radius:3px;background:var(--border);position:relative"><span style="position:absolute;left:${((r.low / max) * 100).toFixed(1)}%;width:${Math.max(1, ((r.high - r.low) / max) * 100).toFixed(1)}%;top:0;bottom:0;border-radius:3px;background:var(--series-1);opacity:.6"></span></div></td></tr>`;
  }
  return h + `</tbody></table></div></div>`;
}

function refresh() {
  readInputs();
  const est = estimate(spec, state);
  const tier = tierOptions.find((o) => o.id === state.tier) || tierOptions[0];
  if ($("tierNote")) $("tierNote").innerHTML = esc(tier.note || "") + tip(tier.rationale);
  if (spec.presets) { const pr = spec.presets.options.find((o) => o.id === est.preset); $("presetNote").innerHTML = esc((pr && pr.note) || "") + tip(pr && pr.rationale); }
  const prov = curProvider();
  if (prov) $("provInfo").innerHTML = `${spark(prov, state.year)}<br><span class="muted">${prov.factor === 1 ? "Market-average prices" : Math.round(Math.abs(prov.factor - 1) * 100) + "% " + (prov.factor > 1 ? "above" : "below") + " market"} · ${signedPct(est.provider.rate)} a year ${tip(prov.factorBasis + " " + prov.rationale)}</span>`;
  const off = est.lines.filter((l) => !l.on).length;
  const contAmt = [est.subLow * est.contingency, est.subHigh * est.contingency];
  const maxHigh = Math.max(1, ...est.groups.map((g) => g.high));
  const preset = spec.presets ? spec.presets.options.find((o) => o.id === est.preset) : null;
  const when = P ? ` · ${state.year}${state.year > spec.priceYear ? " (projected)" : ""}` : "";
  let h = `<div class="panel"><p class="eyebrow">Estimated total${preset ? " · " + esc(preset.label) : ""}${tier.label ? " · " + esc(tier.label) : ""}${prov ? " · " + esc(prov.name) : ""}${when}</p>
    <p class="range-big num">${range(est.low, est.high)}</p>
    <p class="muted" style="margin:0">Typical: <b class="num">${money(est.mid, CUR)}</b>${est.contingency > 0 ? ` · includes a ${pct(est.contingency)} buffer (${range(contAmt[0], contAmt[1])})` : ""}${off ? ` · ${off} ${off === 1 ? "line" : "lines"} not included` : ""}${P && state.year > spec.priceYear ? ` · ${spec.priceYear} prices grown ${est.provider.years} ${est.provider.years === 1 ? "year" : "years"} at ${signedPct(est.provider.rate)} a year` : ""}</p></div>`;
  if (P) h += providerTable();
  h += `<div class="panel chart"><div class="panel-head"><h3>Range by group</h3><span class="muted small">Bar spans low to high; tick is the middle</span></div>${rangeChart(est, maxHigh)}</div>`;
  if (P) h += providerPanel(est);
  $("summary").innerHTML = h;
  for (const g of est.groups) { const el = $("grp-" + g.id); if (el) el.textContent = range(g.low, g.high); }
  for (const l of est.lines) {
    const def = spec.lines.find((x) => x.id === l.id);
    const row = document.querySelector(`tr[data-line="${CSS.escape(l.id)}"]`);
    row.classList.toggle("off", !l.on);
    row.querySelector("[data-on]").checked = l.on;
    $("lo-" + l.id).textContent = l.on ? money(l.low, CUR) : "–";
    $("hi-" + l.id).textContent = l.on ? money(l.high, CUR) : "–";
    $("u-" + l.id).textContent = `× ${range(l.unitLow, l.unitHigh)} ${def.unit}`;
    if (l.per) { const inp = spec.inputs.find((i) => i.id === l.per); $("q-" + l.id).textContent = l.qty.toLocaleString("en-SG") + (inp && inp.unit ? " " + inp.unit : ""); }
  }
  document.querySelectorAll("[data-choice]").forEach((b) => b.setAttribute("aria-pressed", String(state.inputs[b.dataset.choice] === Number(b.dataset.value))));
  syncErrors();
}

function rangeChart(est, maxHigh) {
  const shown = est.groups.filter((g) => g.high > 0);
  const W = 640, LBL = 170, R = 130, ROW = 34, T = 8, H = T + ROW * Math.max(1, shown.length) + 6;
  const step = niceStep(maxHigh * (1 + est.contingency) / 4), top = Math.ceil(maxHigh * (1 + est.contingency) / step) * step;
  const x = (v) => LBL + (W - LBL - R) * (v / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost range by group">`;
  shown.forEach((g, i) => {
    const y = T + ROW * i;
    const lo = g.low * (1 + est.contingency), hi = g.high * (1 + est.contingency);
    const label = g.label.length > 24 ? g.label.slice(0, 23) + "…" : g.label;
    svg += `<text x="${LBL - 8}" y="${y + 20}" text-anchor="end" font-size="12" fill="var(--fg)">${esc(label)}</text>`;
    svg += `<rect x="${LBL}" y="${y + 8}" width="${W - LBL - R}" height="16" rx="3" fill="var(--chip)"/>`;
    svg += `<rect class="bar" x="${x(lo)}" y="${y + 8}" width="${Math.max(3, x(hi) - x(lo))}" height="16" rx="3" fill="var(--series-1)"><title>${esc(g.label)}: ${range(lo, hi)}</title></rect>`;
    svg += `<line x1="${x((lo + hi) / 2)}" x2="${x((lo + hi) / 2)}" y1="${y + 5}" y2="${y + 27}" stroke="var(--fg)" stroke-width="2"/>`;
    svg += `<text x="${W - R + 8}" y="${y + 20}" font-size="11" fill="var(--muted)" font-family="var(--font-mono)">${shortMoney(lo)}–${shortMoney(hi)}</text>`;
  });
  if (!shown.length) svg += `<text x="${W / 2}" y="${T + 20}" text-anchor="middle" font-size="12" fill="var(--muted)">No lines included</text>`;
  return svg + `</svg>`;
}

document.title = spec.title;
$("title").textContent = spec.title;
$("scope").textContent = spec.scope || "";
$("limits").textContent = (spec.limits ? spec.limits + " " : "") + `Prices are ${spec.priceYear} ranges in ${CUR}; a quote for your own ${spec.subject} will differ.`;
initTips();
renderSidebar();
renderLines();
refresh();

$("sidebar").addEventListener("click", (e) => {
  const c = e.target.closest("[data-choice]");
  if (c) { state.inputText[c.dataset.choice] = c.dataset.value; $("in-" + c.dataset.choice).value = c.dataset.value; refresh(); return; }
  const b = e.target.closest("[data-tier]");
  if (!b) return;
  state.tier = b.dataset.tier;
  document.querySelectorAll("[data-tier]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.tier === state.tier)));
  refresh();
});
$("sidebar").addEventListener("change", (e) => {
  if (e.target.id === "presetSel") { state.preset = e.target.value; state.on = {}; refresh(); }
  else if (e.target.id === "provSel") { state.provider = e.target.value; refresh(); }
});
$("sidebar").addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.input) state.inputText[t.dataset.input] = t.value;
  else if (t.id === "cont") state.contText = t.value;
  else if (t.id === "year") state.yearText = t.value;
  else return;
  refresh();
});
function pickProvider(row) { if (!row || row.dataset.pick === state.provider) return; state.provider = row.dataset.pick; $("provSel").value = state.provider; refresh(); }
$("summary").addEventListener("click", (e) => pickProvider(e.target.closest("tr[data-pick]")));
$("summary").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { const row = e.target.closest("tr[data-pick]"); if (row) { e.preventDefault(); pickProvider(row); } } });
$("lines").addEventListener("input", (e) => { if (e.target.dataset.qty) { state.qtyText[e.target.dataset.qty] = e.target.value; refresh(); } });
$("lines").addEventListener("change", (e) => { if (e.target.dataset.on) { state.on[e.target.dataset.on] = e.target.checked; refresh(); } });
</script></body></html>
