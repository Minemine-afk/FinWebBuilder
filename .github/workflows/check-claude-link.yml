name: Check Claude link

# Confirms the builder can reach Claude with the credential saved in this repository.
# Run it by hand from the Actions tab (Run workflow) after adding or changing a secret.
# It also runs every Monday; a failure on that schedule opens an issue.
# It makes one tiny test call. Like the Build workflow, the API key wins if both secrets exist.
run-name: "Check Claude link"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the link
        id: test
        run: |
          set -u
          fail() { echo "result=Failed: $1" >> "$GITHUB_OUTPUT"; echo "Failed: $1"; echo "### Failed: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          ok() { echo "result=$1" >> "$GITHUB_OUTPUT"; echo "$1"; echo "### $1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -n "$API_KEY" ]; then
            code=$(curl -sS -o resp.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
              -H "x-api-key: $API_KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d '{"model":"claude-haiku-5-5","max_tokens":8,"messages":[{"role":"user","content":"Reply with OK"}]}') || fail "could not reach Claude (network problem). Run the check again."
            case "$code" in
              200) ok "Linked using API key" ;;
              401|403) fail "the API key is not accepted. Create a new key in the Claude Console and update the ANTHROPIC_API_KEY secret." ;;
              402) fail "the Claude Console account has no credit. Add credit under Billing." ;;
              429) fail "rate or spending limit reached. Wait and run the check again." ;;
              *) fail "unexpected answer from Claude (HTTP $code). Run the check again; if it repeats, see the guide's troubleshooting table." ;;
            esac
          elif [ -n "$OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || fail "could not install Claude Code on the runner. Run the check again."
            if out=$(CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN" timeout 120 claude -p "Reply with OK" --model haiku --max-turns 1 2>&1); then
              ok "Linked using subscription token"
            else
              echo "$out" | tail -5
              if echo "$out" | grep -qiE "limit|quota|usage"; then
                fail "the subscription's usage limit is reached. Wait for it to reset or use another account."
              elif echo "$out" | grep -qiE "401|auth|token|expired|invalid|login"; then
                fail "the subscription token is expired or not accepted. Run 'claude setup-token' again and update the CLAUDE_CODE_OAUTH_TOKEN secret."
              else
                fail "the test call did not work. Open this run's log to read the message, then see the guide's troubleshooting table."
              fi
            fi
          else
            fail "no Claude secret is saved. Add CLAUDE_CODE_OAUTH_TOKEN (subscription) or ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
          fi
      # The website reads this step's name to show the answer without opening GitHub.
      - name: "Result: ${{ steps.test.outputs.result || 'Failed: the check could not run' }}"
        if: always()
        run: echo "${{ steps.test.outputs.result }}"
      - name: Open an issue when the weekly check fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.test.outputs.result }}
        with:
          script: |
            const title = "Claude link check failed";
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const reason = process.env.RESULT || "Failed: the check could not run. Open the run for details.";
            const body = `${reason}\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nFix the secret, then run **Check Claude link** from the Actions tab to confirm. See section 9 of docs/USER-GUIDE.md.`;
            const existing = open.data.find((i) => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });
